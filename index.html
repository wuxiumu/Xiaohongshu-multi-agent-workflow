<div style="max-width:860px;margin:24px auto;padding:0 20px;font-family:-apple-system,'PingFang SC',sans-serif;color:#1f2937;line-height:1.8">
  <h2>小红书多智能体内容生产流水线（收集 → 判断 → 执行）</h2>
  <p>一套用 Python、LLM、Playwright 与 PHP 实现的小红书选题研究与内容生产自动化框架。三个智能体分工协作：收集智能体用 LLM 把赛道种子词扩成长尾关键词，并用 Playwright 抓取小红书爆款样本；判断智能体用纯 Python 规则对关键词热度评分排序，再由 LLM 提炼爆款模式、生成差异化选题；执行智能体按 AI 教程、Skill 分享、PPT 模板三条内容轨组装标题、正文、配图与可复制模板。所有状态落 JSON 文件，支持断点续跑；系统只产出本地待发布物料，永远不自动发帖。</p>
  <h3>三智能体职责</h3>
  <ol>
    <li>收集智能体 Collector：LLM 关键词扩展 + Playwright 爆款笔记抓取（扫码登录一次、限速 5-8 秒、单次不超过 50 条）；</li>
    <li>判断智能体 Judge：确定性规则评分（快、零 token），LLM 负责爆款模式提炼与选题生成；</li>
    <li>执行智能体 Executor：tutorial 分步教程、skill 代码演示、ppt 逐页成稿 Markdown 模板三轨分派。</li>
  </ol>
  <h3>数据流转</h3>
  <p>collected.json（关键词库+爆款样本）→ judged.json（评分与选题队列）→ produced.json（成品笔记与配图路径），文件即数据库，可读、可 diff、可手工修复，重启无状态丢失。</p>
  <h3>看板与接口</h3>
  <p>根目录静态 index.html 搭配单文件只读 api.php（list/post/stats/flow/scripts/image/md_download），php -S 或任意 PHP 虚拟主机即可运行，无需数据库；图片接口以 realpath 白名单限制在 data 目录内，防止目录穿越；API Key 只存于项目外的 ~/.openclaw/openclaw.json，仓库零密钥。</p>
  <p>开源仓库：<a href="https://github.com/wuxiumu/Xiaohongshu-multi-agent-workflow">github.com/wuxiumu/Xiaohongshu-multi-agent-workflow</a>。开启 JavaScript 后可浏览 16 篇成品、详情与生产流程。</p>
